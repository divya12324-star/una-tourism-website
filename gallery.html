<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* 🌈 BEST TOURISM BACKGROUND */
body{
    background: linear-gradient(135deg, #dff6ff, #ffffff, #eaf4f4);
}

/* TITLE */
.title{
    text-align:center;
    font-size:42px;
    margin:30px 0;
    color:#0f4c75;
}

/* GALLERY GRID */
.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
    padding:20px 50px;
}

/* IMAGES */
.gallery-grid img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    transition:0.3s;
}

.gallery-grid img:hover{
    transform:scale(1.05);
}

/* FOOTER */
footer{
    margin-top:40px;
    background:#0f4c75;
    color:white;
    text-align:center;
    padding:20px;
    font-size:16px;
}

</style>
</head>
